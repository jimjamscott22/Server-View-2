<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="100%" stop-color="#0b1119"/>
    </linearGradient>
    <linearGradient id="rack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4b5c"/>
      <stop offset="100%" stop-color="#232f3a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Server rack -->
  <g>
    <rect x="118" y="118" width="180" height="276" rx="18" fill="url(#rack)" stroke="#0b1119" stroke-width="4"/>
    <!-- rack units -->
    <g fill="#141c26">
      <rect x="138" y="140" width="140" height="42" rx="7"/>
      <rect x="138" y="196" width="140" height="42" rx="7"/>
      <rect x="138" y="252" width="140" height="42" rx="7"/>
      <rect x="138" y="308" width="140" height="42" rx="7"/>
    </g>
    <!-- status lights -->
    <circle cx="156" cy="161" r="6" fill="#4ade80"/>
    <circle cx="156" cy="217" r="6" fill="#22d3ee"/>
    <circle cx="156" cy="273" r="6" fill="#4ade80"/>
    <circle cx="156" cy="329" r="6" fill="#facc15"/>
    <!-- vent lines -->
    <g stroke="#3a4b5c" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="150" x2="262" y2="150"/>
      <line x1="196" y1="171" x2="262" y2="171"/>
      <line x1="196" y1="206" x2="262" y2="206"/>
      <line x1="196" y1="227" x2="262" y2="227"/>
      <line x1="196" y1="262" x2="262" y2="262"/>
      <line x1="196" y1="283" x2="262" y2="283"/>
      <line x1="196" y1="318" x2="262" y2="318"/>
      <line x1="196" y1="339" x2="262" y2="339"/>
    </g>
  </g>

  <!-- Monitoring pulse line across a dashboard panel -->
  <g filter="url(#glow)">
    <path d="M 96 410 h 60 l 22 -46 l 26 70 l 24 -110 l 22 86 l 20 -40 h 146"
          fill="none" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small orbiting status dot representing "live" polling -->
  <circle cx="382" cy="410" r="12" fill="#4ade80"/>
  <circle cx="382" cy="410" r="20" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.5"/>
</svg>
